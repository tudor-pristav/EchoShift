name: Plain Java checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare libraries
        run: |
          mkdir -p lib
          curl --fail --location --retry 3 https://download2.gluonhq.com/openjfx/25.0.2/openjfx-25.0.2_linux-x64_bin-sdk.zip -o lib/javafx.zip
          unzip -q lib/javafx.zip -d lib
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar -o lib/gson.jar
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar -o lib/junit.jar
          echo "JAVAFX_LIB=$GITHUB_WORKSPACE/lib/javafx-sdk-25.0.2/lib" >> "$GITHUB_ENV"
          echo "GSON_JAR=$GITHUB_WORKSPACE/lib/gson.jar" >> "$GITHUB_ENV"
          echo "JUNIT_JAR=$GITHUB_WORKSPACE/lib/junit.jar" >> "$GITHUB_ENV"
      - name: Build and regression checks
        run: python3 scripts/build.py test
      - name: Original JUnit suite
        run: xvfb-run -a python3 scripts/build.py junit
      - name: JavaFX smoke test
        run: xvfb-run -a python3 scripts/build.py smoke
